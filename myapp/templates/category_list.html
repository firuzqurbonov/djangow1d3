<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категории | ApexCode</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #080711; color: #f8fafc; min-height: 100vh; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 3rem auto; }
        h1 { font-size: 2.2rem; background: linear-gradient(135deg, #a855f7, #6366f1); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; padding: 0.8rem 1.5rem; border-radius: 12px; text-decoration: none; font-weight: 600; box-shadow: 0 0 15px rgba(99,102,241,0.4); }
        .btn-home { background: transparent; border: 1px solid rgba(255,255,255,0.2); box-shadow: none; margin-right: 1rem; }

        .list-container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
        .item-row { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 1.2rem 1.8rem; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .item-row:hover { border-color: #6366f1; transform: translateX(5px); box-shadow: 0 5px 15px rgba(99,102,241,0.2); }
        
        .item-title { font-size: 1.2rem; font-weight: 600; color: #f8fafc; text-decoration: none; }
        .actions { display: flex; gap: 0.6rem; }
        .btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; border-radius: 8px; text-decoration: none; font-weight: 500; }
        .btn-view { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .btn-edit { background: rgba(250, 204, 21, 0.15); color: #facc15; }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <a href="{% url 'home' %}" class="btn btn-home">&larr; Главная</a>
            <h1 style="display:inline-block;">Категории</h1>
        </div>
        <a href="{% url 'category_create' %}" class="btn">+ Новая категория</a>
    </div>

    <div class="list-container">
        {% for item in categories %}
        <div class="item-row">
            <a href="{% url 'category_detail' item.pk %}" class="item-title">📂 {{ item.name }}</a>
            <div class="actions">
                <a href="{% url 'category_detail' item.pk %}" class="btn-sm btn-view">Обзор</a>
                <a href="{% url 'category_update' item.pk %}" class="btn-sm btn-edit">Изменить</a>
                <a href="{% url 'category_delete' item.pk %}" class="btn-sm btn-delete">Удалить</a>
            </div>
        </div>
        {% empty %}
        <p style="color: #94a3b8;">Категорий пока нет.</p>
        {% endfor %}
    </div>
</body>
</html>
