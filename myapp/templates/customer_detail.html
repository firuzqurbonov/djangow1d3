<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>{{ customer.name }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #080711; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: rgba(17, 24, 39, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 2.5rem; max-width: 500px; width: 100%; }
        h2 { font-size: 2rem; color: #38bdf8; margin-bottom: 1.5rem; }
        p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 0.8rem; }
        .back-btn { display: inline-block; color: #38bdf8; text-decoration: none; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>👤 {{ customer.name }}</h2>
        <p><b>Телефон:</b> {{ customer.phone }}</p>
        <p><b>Адрес:</b> {{ customer.address }}</p>
        <a href="{% url 'customer_list' %}" class="back-btn">&larr; Назад к клиентам</a>
    </div>
</body>
</html>
