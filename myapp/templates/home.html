<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Управления | ApexCode</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #080711; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-x: hidden; }
        
        .nav-bar { position: absolute; top: 20px; right: 30px; display: flex; gap: 1rem; align-items: center; z-index: 10; }
        .user-info { color: #38bdf8; font-weight: 600; }
        .btn-auth { background: rgba(99,102,241,0.2); border: 1px solid #6366f1; color: white; padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        .btn-auth:hover { background: #6366f1; }

        .glow-bg { position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(99,102,241,0.25) 0%, rgba(0,0,0,0) 70%); top: 30%; left: 50%; transform: translate(-50%, -50%); z-index: 0; }

        .container { position: relative; z-index: 1; text-align: center; max-width: 900px; width: 90%; }
        h1 { font-size: 3rem; background: linear-gradient(135deg, #a855f7, #6366f1, #38bdf8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; }
        p.subtitle { color: #94a3b8; font-size: 1.2rem; margin-bottom: 3rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; }
        .card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 2.5rem 1.5rem; text-decoration: none; color: white; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; }
        .card:hover { transform: translateY(-8px); border-color: #38bdf8; box-shadow: 0 0 25px rgba(56, 189, 248, 0.4); }
        .card-icon { font-size: 3rem; margin-bottom: 1rem; }
        .card h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .card span { color: #38bdf8; font-size: 0.9rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="nav-bar">
        {% if user.is_authenticated %}
            <span class="user-info">👤 {{ user.username }}</span>
            <a href="{% url 'logout' %}" class="btn-auth">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}" class="btn-auth">Войти</a>
            <a href="{% url 'register' %}" class="btn-auth" style="background:#6366f1;">Регистрация</a>
        {% endif %}
    </div>

    <div class="glow-bg"></div>

    <div class="container">
        <h1>Панель Управления</h1>
        <p class="subtitle">Выберите раздел для работы с базой данных</p>
        <div class="grid">
            <a href="{% url 'category_list' %}" class="card">
                <div class="card-icon">📂</div>
                <h2>Categories</h2>
                <span>Управление категориями &rarr;</span>
            </a>
            <a href="{% url 'product_list' %}" class="card">
                <div class="card-icon">🛍️</div>
                <h2>Products</h2>
                <span>Каталог товаров &rarr;</span>
            </a>
            <a href="{% url 'customer_list' %}" class="card">
                <div class="card-icon">👥</div>
                <h2>Customers</h2>
                <span>База клиентов &rarr;</span>
            </a>
        </div>
    </div>
</body>
</html>
