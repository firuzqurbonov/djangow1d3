<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | ApexCode</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #080711; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 2rem; }
        
        .form-card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 500px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        h2 { font-size: 1.8rem; margin-bottom: 2rem; background: linear-gradient(135deg, #a855f7, #38bdf8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }

        p { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.9rem; }
        input, textarea, select { width: 100%; padding: 0.8rem 1rem; background: #0b0f19; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: white; font-size: 1rem; outline: none; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #6366f1; box-shadow: 0 0 10px rgba(99,102,241,0.4); }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; padding: 0.9rem; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 1rem; box-shadow: 0 0 15px rgba(99,102,241,0.4); transition: 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(168,85,247,0.6); }
        .cancel-link { display: block; text-align: center; margin-top: 1.2rem; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
        .cancel-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>{{ title }}</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Сохранить</button>
        </form>
        <a href="javascript:history.back()" class="cancel-link">&larr; Отмена</a>
    </div>
</body>
</html>
