<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары | ApexCode</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #080711; color: #f8fafc; min-height: 100vh; padding: 2rem; }
        
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 3rem auto; flex-wrap: wrap; gap: 1rem; }
        h1 { font-size: 2.2rem; background: linear-gradient(135deg, #a855f7, #38bdf8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; padding: 0.8rem 1.5rem; border-radius: 12px; text-decoration: none; font-weight: 600; box-shadow: 0 0 15px rgba(99,102,241,0.4); transition: 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(168,85,247,0.6); }
        .btn-home { background: transparent; border: 1px solid rgba(255,255,255,0.2); box-shadow: none; margin-right: 1rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; max-width: 1200px; margin: 0 auto; }
        .card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #a855f7; box-shadow: 0 10px 25px rgba(168,85,247,0.2); }
        
        .card-img { width: 100%; height: 180px; object-fit: cover; background: #111827; }
        .card-body { padding: 1.5rem; }
        .card-title { font-size: 1.3rem; margin-bottom: 0.5rem; color: #f8fafc; }
        .card-price { font-size: 1.4rem; color: #38bdf8; font-weight: 700; margin-bottom: 1rem; }
        
        .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 8px; text-decoration: none; font-weight: 500; transition: 0.2s; text-align: center; flex: 1; }
        .btn-view { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .btn-edit { background: rgba(250, 204, 21, 0.15); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.3); }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-sm:hover { opacity: 0.8; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <a href="{% url 'home' %}" class="btn btn-home">&larr; Главная</a>
            <h1 style="display:inline-block;">Список Товаров</h1>
        </div>
        <a href="{% url 'product_create' %}" class="btn">+ Добавить товар</a>
    </div>

    <div class="grid">
        {% for item in products %}
        <div class="card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" class="card-img" alt="Product">
            <div class="card-body">
                <div class="card-title">{{ item.name }}</div>
                <div class="card-price">${{ item.price }}</div>
                <div class="actions">
                    <a href="{% url 'product_detail' item.pk %}" class="btn-sm btn-view">Инфо</a>
                    <a href="{% url 'product_update' item.pk %}" class="btn-sm btn-edit">Изменить</a>
                    <a href="{% url 'product_delete' item.pk %}" class="btn-sm btn-delete">Удалить</a>
                </div>
            </div>
        </div>
        {% empty %}
        <p style="color: #94a3b8;">Товаров пока нет. Добавьте первый!</p>
        {% endfor %}
    </div>
</body>
</html>
